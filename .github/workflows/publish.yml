name: Publish to pub.dev

on:
  push:
    tags:
      # Per-package tags, e.g. fl_updater-v0.2.1 / fl_updater_firebase-v0.2.0.
      # Set the same patterns (`<package>-v{{version}}`) in each package's
      # pub.dev automated-publishing settings.
      - 'fl_updater-v[0-9]+.[0-9]+.[0-9]+*'
      - 'fl_updater_firebase-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write # Required for pub.dev OIDC authentication
  contents: read

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for pub.dev OIDC authentication
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Dart (for OIDC auth with pub.dev)
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: |
          for d in packages/*; do (cd "$d" && flutter test) || exit 1; done

      - name: Publish package named by the tag
        run: |
          pkg="${GITHUB_REF_NAME%%-v*}"
          cd "packages/$pkg"
          dart pub publish --force
