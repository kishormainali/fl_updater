name: fl_updater_example
description: "Demonstrates how to use the fl_updater plugin."
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  fl_updater:
    path: ../
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
