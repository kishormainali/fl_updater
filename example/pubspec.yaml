name: fl_updater_example
description: "Demonstrates how to use the fl_updater plugin."
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  fl_updater:
    path: ../packages/fl_updater
  fl_updater_firebase:
    path: ../packages/fl_updater_firebase
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
